<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Awesome LLM Guardrails — the directory of LLM guardrail tools</title>
<meta name="description" content="A curated, filterable directory of open-source guardrails for LLM apps: prompt-injection defense, PII, content safety, structured output, and red-teaming." />
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --bd:#262d36; --tx:#e6edf3; --mut:#9aa7b4;
    --acc:#6ee7b7; --acc2:#38bdf8; --chip:#1f2630;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fa; --panel:#ffffff; --panel2:#f0f2f5; --bd:#e2e6eb; --tx:#0d1117; --mut:#586069; --acc:#059669; --acc2:#0284c7; --chip:#eef1f5; }
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--acc2);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1160px;margin:0 auto;padding:clamp(16px,4vw,30px) clamp(14px,4vw,26px) 60px}
  header h1{margin:0 0 4px;font-size:1.7rem;letter-spacing:-.02em}
  header h1 .g{color:var(--acc)}
  header p{margin:0;color:var(--mut)}
  .top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .ghlink{border:1px solid var(--bd);background:var(--panel);padding:7px 12px;border-radius:8px;color:var(--tx);font-weight:600;font-size:.86rem}
  .controls{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--bd);margin-bottom:16px}
  #q{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--panel);color:var(--tx);font-size:1rem;outline:none}
  #q:focus{border-color:var(--acc2)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chip{cursor:pointer;border:1px solid var(--bd);background:var(--chip);color:var(--mut);padding:5px 11px;border-radius:999px;font-size:.82rem;user-select:none}
  .chip.on{background:var(--acc2);border-color:var(--acc2);color:#04121c;font-weight:700}
  .count{color:var(--mut);font-size:.82rem;margin:6px 2px 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
  .card{border:1px solid var(--bd);background:var(--panel);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:8px}
  .card:hover{border-color:var(--acc2)}
  .card .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card .h a{font-weight:700;font-size:1.02rem;color:var(--tx)}
  .stars{color:var(--mut);font-size:.8rem;white-space:nowrap}
  .cat{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);font-weight:700}
  .desc{color:var(--mut);font-size:.88rem;margin:0}
  .flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .flag{font-size:.71rem;border:1px solid var(--bd);background:var(--panel2);color:var(--mut);padding:2px 7px;border-radius:6px}
  @media (max-width:520px){.top{flex-direction:column;align-items:flex-start}.card{padding:13px}}
  footer{margin-top:34px;color:var(--mut);font-size:.82rem;text-align:center}
  .empty{color:var(--mut);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <header>
      <h1>Awesome <span class="g">LLM Guardrails</span></h1>
      <p>The filterable directory of open-source guardrails for LLM apps.</p>
    </header>
    <a class="ghlink" href="https://github.com/royalpinto007/awesome-llm-guardrails">★ Star on GitHub</a>
  </div>

  <div class="controls">
    <input id="q" type="search" placeholder="Search guardrails…  (e.g. injection, PII, JSON, jailbreak, toxicity)" autocomplete="off" />
    <div class="chips" id="chips"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No matches. Try another term, or <a href="https://github.com/royalpinto007/awesome-llm-guardrails#contributing">add the tool</a>.</div>

  <footer>
    <span id="updated"></span> ·
    <a href="https://github.com/royalpinto007/awesome-llm-guardrails">Contribute a tool</a> ·
    built by <a href="https://royalpinto007.agentpostmortem.com">Royal Pinto</a>
  </footer>
</div>

<script>
const DATA = [{"name":"Guardrails AI","repo":"guardrails-ai/guardrails","url":"https://github.com/guardrails-ai/guardrails","category":"framework","desc":"Add input/output validators and structured guarantees to LLMs, with a hub of reusable validators.","stars":7293},{"name":"NeMo Guardrails","repo":"NVIDIA/NeMo-Guardrails","url":"https://github.com/NVIDIA/NeMo-Guardrails","category":"framework","desc":"Programmable rails for LLM conversational systems, defined in a dedicated modeling language (by NVIDIA).","stars":6963},{"name":"LLM Guard","repo":"protectai/llm-guard","url":"https://github.com/protectai/llm-guard","category":"framework","desc":"A security toolkit for LLM interactions: scanners for PII, toxicity, prompt injection, and more, on both input and output.","stars":3201},{"name":"LangKit","repo":"whylabs/langkit","url":"https://github.com/whylabs/langkit","category":"framework","desc":"An open-source toolkit for monitoring LLMs — extract safety and quality signals from prompts and responses (by WhyLabs).","stars":994},{"name":"Rebuff","repo":"protectai/rebuff","url":"https://github.com/protectai/rebuff","category":"injection","desc":"A self-hardening prompt-injection detector that layers heuristics, an LLM check, a vector DB of known attacks, and canary tokens.","stars":1520},{"name":"Vigil","repo":"deadbits/vigil-llm","url":"https://github.com/deadbits/vigil-llm","category":"injection","desc":"Detect prompt injections, jailbreaks, and other risky inputs before they reach your model.","stars":496},{"name":"Llama Guard / PurpleLlama","repo":"meta-llama/PurpleLlama","url":"https://github.com/meta-llama/PurpleLlama","category":"injection","desc":"Meta's suite for LLM safety: Llama Guard (input/output classification), Prompt Guard (injection detection), and CyberSecEval benchmarks.","stars":4356},{"name":"Injection Arena","repo":"royalpinto007/injection-arena","url":"https://github.com/royalpinto007/injection-arena","category":"injection","desc":"A self-hostable capture-the-flag game for learning prompt-injection defenses against a stack of guardrails.","stars":0},{"name":"Guidance","repo":"guidance-ai/guidance","url":"https://github.com/guidance-ai/guidance","category":"structured","desc":"A guidance language for constraining generation — interleave control flow, regex, and grammars so the model can only produce valid output.","stars":21712},{"name":"Outlines","repo":"dottxt-ai/outlines","url":"https://github.com/dottxt-ai/outlines","category":"structured","desc":"Structured generation: force outputs to match a JSON schema, regex, or grammar, guaranteeing shape.","stars":15632},{"name":"Instructor","repo":"jxnl/instructor","url":"https://github.com/jxnl/instructor","category":"structured","desc":"Structured outputs for LLMs via Pydantic — validate and retry until the response matches your model.","stars":13737},{"name":"Jsonformer","repo":"1rgs/jsonformer","url":"https://github.com/1rgs/jsonformer","category":"structured","desc":"A bulletproof way to generate structured JSON: only the content tokens are sampled, the structure is fixed.","stars":4933},{"name":"Presidio","repo":"microsoft/presidio","url":"https://github.com/microsoft/presidio","category":"privacy","desc":"Detect, redact, mask, and anonymize PII in text and images — the standard for privacy guardrails (by Microsoft).","stars":10512},{"name":"Detoxify","repo":"unitaryai/detoxify","url":"https://github.com/unitaryai/detoxify","category":"content","desc":"Trained models to score toxicity, threats, and hate in text — a lightweight content-safety filter.","stars":1289},{"name":"garak","repo":"NVIDIA/garak","url":"https://github.com/NVIDIA/garak","category":"redteam","desc":"The LLM vulnerability scanner — probe a model for jailbreaks, injections, data leakage, and toxicity before you ship (by NVIDIA).","stars":8832},{"name":"DeepTeam","repo":"confident-ai/deepteam","url":"https://github.com/confident-ai/deepteam","category":"redteam","desc":"A framework to red-team LLMs and AI agents against 40+ vulnerabilities and attack methods.","stars":2451},{"name":"Giskard","repo":"Giskard-AI/giskard","url":"https://github.com/Giskard-AI/giskard","category":"redteam","desc":"Open-source scanning for LLM agents that surfaces safety and quality vulnerabilities automatically.","stars":5754},{"name":"ModelScan","repo":"protectai/modelscan","url":"https://github.com/protectai/modelscan","category":"supply","desc":"Scan model files for serialization attacks — the supply-chain guardrail for weights you download.","stars":762},{"name":"Skill-audit","repo":"royalpinto007/Skill-audit","url":"https://github.com/royalpinto007/Skill-audit","category":"supply","desc":"Security scanner for agent skills: flags prompt-injection, dangerous shell, secret access, and exfiltration before you install a skill.","stars":1}];
const UPDATED = "2026-08-17";
const CATS = {framework:"Frameworks",injection:"Injection Defense",structured:"Structured Output",privacy:"PII & Privacy",content:"Content Safety",redteam:"Red-Teaming",supply:"Supply-Chain"};
let active = "all", q = "";

const chips = document.getElementById("chips");
[["all","All"], ...Object.entries(CATS)].forEach(([k,label])=>{
  const c=document.createElement("span"); c.className="chip"+(k==="all"?" on":""); c.textContent=label; c.dataset.k=k;
  c.onclick=()=>{active=k;[...chips.children].forEach(x=>x.classList.toggle("on",x.dataset.k===k));render();};
  chips.appendChild(c);
});
const qi=document.getElementById("q");
qi.oninput=()=>{q=qi.value.trim().toLowerCase();render();};

function flags(t){
  return ""; // guardrails entries carry no comparison flags
  const f=[];
  f.push(t.host); f.push(t.mode==="both"?"offline+online":t.mode);
  if(t.judge) f.push("LLM-judge"); f.push(t.lang); if(t.rag) f.push("RAG");
  return '<div class="flags">'+f.map(x=>'<span class="flag">'+x+'</span>').join("")+'</div>';
}
function kfmt(n){return n==null?"":n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":""+n;}

function render(){
  const grid=document.getElementById("grid"); grid.innerHTML="";
  const rows=DATA.filter(t=>{
    if(active!=="all"&&t.category!==active) return false;
    if(!q) return true;
    return (t.name+" "+t.desc+" "+t.category+" "+(t.lang||"")).toLowerCase().includes(q);
  }).sort((a,b)=>(b.stars||0)-(a.stars||0));
  document.getElementById("count").textContent=rows.length+" of "+DATA.length+" shown";
  document.getElementById("empty").hidden=rows.length>0;
  for(const t of rows){
    const el=document.createElement("div"); el.className="card";
    el.innerHTML=
      '<div class="cat">'+(CATS[t.category]||t.category)+'</div>'+
      '<div class="h"><a href="'+t.url+'" target="_blank" rel="noopener">'+t.name+'</a>'+
      (t.stars!=null?'<span class="stars">★ '+kfmt(t.stars)+'</span>':'')+'</div>'+
      '<p class="desc">'+t.desc+'</p>'+flags(t);
    grid.appendChild(el);
  }
}
document.getElementById("updated").textContent = UPDATED ? ("Star counts updated "+UPDATED) : "Community-curated";
render();
</script>
</body>
</html>
